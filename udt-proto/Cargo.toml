[package]
name = "udt-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The UDT protocol as sans-IO state machines, owning no sockets, threads or clock"
keywords = ["udt", "sans-io", "transport", "udp", "protocol"]
categories = ["network-programming"]
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Exposes internals to the fuzz targets. Not for general use: it widens the
# public surface to things with no stability promise at all.
fuzzing = []

[dependencies]
bytes = "1"
rand = "0.9"
md-5 = "0.11"

