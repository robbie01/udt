[package]
name = "tcp-bench"
version.workspace = true
edition.workspace = true
publish = false

# Establishes what this machine's loopback can actually do, as the ceiling to
# read the UDT numbers against. Not a dependency of anything.
[dependencies]
tokio = { version = "1", features = ["full"] }
compio = { version = "0.19", features = ["macros", "runtime", "net", "io"] }
core_affinity = "0.8"
libc = "0.2"
socket2 = "0.6"
