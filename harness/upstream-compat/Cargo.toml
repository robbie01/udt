[package]
name = "udt-upstream-compat-tests"
version.workspace = true
edition.workspace = true
publish = false

# IMPORTANT: this crate must depend on `udt-orig` and NOT on `udt-compat`.
# Both compile a full copy of UDT with byte-identical C++ symbols; linking both
# into one test binary is an ODR violation with two CUDT::s_UDTUnited
# singletons. `udt-proto`/`udt-async` are pure Rust and pull in neither, which
# is what makes this separation possible. See udt-orig/src/lib.rs.
[dependencies]
udt-async = { workspace = true }
udt-orig = { path = "../udt-orig" }
tokio = { version = "1", features = ["full"] }
