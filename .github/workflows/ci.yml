name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Every step below is a shell loop or a plain cargo call, and the Windows
    # runner would otherwise use PowerShell, where `for i in $(seq ...)` is not
    # a thing. Git Bash ships on the runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (debug)
        run: cargo test --workspace

      # Release catches the timing-dependent paths that debug's slower code
      # hides, and debug catches the debug_assert!s. Both are needed.
      - name: Test (release)
        run: cargo test --workspace --release

      # Several of the bugs fixed here were one-in-three flaky and only showed
      # up under repeated concurrent load, so a single green run means little.
      - name: Repeat sweep
        run: |
          for i in $(seq 1 10); do
            echo "--- iteration $i"
            cargo test --workspace --release || exit 1
          done

      - name: Slow tests
        run: cargo test --workspace --release -- --ignored --nocapture --test-threads=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo fmt --all --check
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Keep in step with `rust-version` in the workspace manifest. Job names
    # cannot read `env`, so the number appears twice on purpose.
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # The libraries only. Test and benchmark code is not what a consumer
      # compiles, so holding it to the same floor would raise the floor for
      # nobody's benefit.
      - run: cargo build -p udt-proto -p udt-async

  publish-dry-run:
    name: publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches the things that only bite at publish time: a dependency without
      # a version requirement, metadata that does not validate, a file the
      # tarball needs and does not have.
      #
      # `udt-proto` only. `udt-async` depends on it by path, and cargo resolves
      # that from the registry when packaging, so it cannot be verified until
      # `udt-proto` is actually published. That also fixes the publish order.
      - run: cargo publish --dry-run -p udt-proto

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Short runs: enough to catch a target that no longer builds or that
      # regressed on a committed corpus seed, not a real fuzzing campaign.
      - name: Fuzz each target briefly
        run: |
          for target in decode connection listener; do
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=4096
          done
