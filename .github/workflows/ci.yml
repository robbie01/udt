name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not covered yet: the code has never been built there, and
        # a job that has never passed is not a signal.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (debug)
        run: cargo test --workspace

      # Release catches the timing-dependent paths that debug's slower code
      # hides, and debug catches the debug_assert!s. Both are needed.
      - name: Test (release)
        run: cargo test --workspace --release

      # Several of the bugs fixed here were one-in-three flaky and only showed
      # up under repeated concurrent load, so a single green run means little.
      - name: Repeat sweep
        run: |
          for i in $(seq 1 10); do
            echo "--- iteration $i"
            cargo test --workspace --release || exit 1
          done

      - name: Slow tests
        run: cargo test --workspace --release -- --ignored --nocapture --test-threads=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo fmt --all --check
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Short runs: enough to catch a target that no longer builds or that
      # regressed on a committed corpus seed, not a real fuzzing campaign.
      - name: Fuzz each target briefly
        run: |
          for target in decode connection listener; do
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=4096
          done
