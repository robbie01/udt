[package]
name = "quinn-bench"
version.workspace = true
edition.workspace = true
publish = false

# A reference point, not a dependency of anything. Quinn is a mature Rust
# UDP-based reliable transport, so it bounds what this machine's UDP stack can
# do under a comparable design.
[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
