[package]
name = "udt-async"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Reliable, message-oriented transport over UDP on Tokio, wire-compatible with the C++ UDT reference"
keywords = ["udt", "udp", "tokio", "async", "transport"]
categories = ["network-programming", "asynchronous"]
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The version is required to publish: crates.io drops the path and resolves
# the dependency from the registry, so it has to know which release to want.
udt-proto = { path = "../udt-proto", version = "0.0.0" }
bytes = "1"
rand = "0.9"

# Not optional. This crate *is* the Tokio driver: with it excluded there was no
# `Endpoint` and no `Socket`, so the library exported nothing at all while still
# pulling dependencies.
tokio = { version = "1", features = ["net", "time", "sync", "rt", "rt-multi-thread", "macros"] }
socket2 = "0.6"
flume = { version = "0.11", default-features = false, features = ["async"] }
# Batched UDP IO (GSO / recvmmsg) behind a safe API, so this crate keeps
# forbid(unsafe_code) while still using platform offloads.
quinn-udp = "0.5"
